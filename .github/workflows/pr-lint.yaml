name: '🧹 Lint PR Title'
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-22.04
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6
        with:
          types: |
            fix
            feat
            chore
            docs
          scopes: |
            vulnerability
            go
            java
            web
            xtest
            perf
            ci
            dependabot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
