name: Lint and similar things for test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
jobs:
  scriptcheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 🦪 ✔ 🧼🧼🧼
        run: >-
          docker run --rm -v "$PWD:/mnt" --workdir "/mnt" "koalaman/shellcheck:v0.8.0" --color=always \
              $(find . -type f -exec grep -m1 -l -E '^#!.*sh.*' {} \; | grep -v '/.git/')
      - name: Check shell script formatting with shfmt
        run: docker run --rm -v "$PWD:/mnt" --workdir "/mnt" mvdan/shfmt:v3 -d .
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      # This is the one step in the xtest lane that builds anything, so it is
      # also the one that cannot say --no-build: xtest depends on
      # ../otdf-adapter as an editable path dependency, and --no-build refuses
      # any distribution without a wheel, which an editable install has none of
      # by design. What it would guard against is a setup script in a package
      # from this repo, built from this repo's lockfile. The otdf-adapter lane
      # below has no path dependencies and does hold the strong form.
      #
      # --frozen: install exactly what uv.lock says, failing if pyproject.toml
      # was edited without a re-lock. The steps below cannot carry that
      # guarantee themselves -- they install nothing -- so it lives here.
      - name: Install dependencies
        run: uv sync --frozen --extra dev
        working-directory: xtest
      - name: Lint xtest python
        run: |
          uv run --frozen --no-sync --no-build ruff check .
          uv run --frozen --no-sync --no-build ruff format --check .
          uv run --frozen --no-sync --no-build pyright
        working-directory: xtest
      # Offline tests for the harnesses whose own correctness gates a nightly
      # job: the benchmark statistics, measurement and CLI command builders,
      # the encryption fixture cache, and the ZIP64 central-directory parser.
      # No platform and no SDK builds required, so the part that has to be
      # *correct* is checked on every PR rather than only when the nightly runs.
      #
      # --frozen --no-sync --no-build: resolve nothing, install nothing, build
      # nothing. This step runs exactly the environment the install step above
      # produced, and --no-build is free here precisely because --no-sync means
      # there is nothing left to build.
      - name: Test xtest offline harnesses
        run: >-
          uv run --frozen --no-sync --no-build pytest --no-header -q
          test_bench_stats.py test_bench_measure.py test_bench_runner.py
          test_bench_arms.py test_sdk_commands.py test_tdfs_units.py
          test_encryption_units.py test_sizes_units.py test_zip64_units.py
        working-directory: xtest
      # --frozen --no-build throughout: this package has no path dependencies,
      # so unlike the xtest lane above it can hold the strong form -- install
      # exactly what uv.lock pins, from wheels only, running no setup script.
      - name: Lint and test otdf-adapter
        run: |
          uv sync --frozen --no-build
          uv run --frozen --no-build ruff check .
          uv run --frozen --no-build ruff format --check .
          uv run --frozen --no-build pyright
          uv run --frozen --no-build pytest --maxfail=1 --disable-warnings -q
        working-directory: otdf-adapter
      - name: Lint and test otdf-local
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest --maxfail=1 --disable-warnings -v --tb=short -m "not integration"
        working-directory: otdf-local
      - name: Lint and test otdf-sdk-mgr
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest --maxfail=1 --disable-warnings -v --tb=short -m "not integration"
        working-directory: otdf-sdk-mgr
