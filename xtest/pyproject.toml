[project]
name = "xtest"
version = "0.1.0"
description = "OpenTDF cross-SDK integration test suite"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "OpenTDF Team" }]
keywords = ["opentdf", "tdf", "testing", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "cryptography>=50.0.2",
    "jsonschema>=4.25.1",
    "pydantic>=2.13.5",
    "pydantic_core>=2.41.5",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.6.1",
    "requests>=2.34.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]

# Note: This is a test suite, not a distributable package.
# Use `uv pip install -r pyproject.toml` or `uv sync` for dependencies.

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "PERF",   # Perflint
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "B011",   # assert False in test code is common pattern
]

[tool.ruff.lint.isort]
known-first-party = [
    "abac",
    "tdfs",
    "otdfctl",
    "assertions",
    "fixtures",
    "perf",
    "sizes",
    "zipinspect",
    "zipmutate",
    "zipreport",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["."]
exclude = ["**/__pycache__", ".venv", ".ruff_cache", ".pytest_cache", "sdk", "tmp", "golden"]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -v"
markers = [
    "benchmark: paired A/B performance cell; only collected under --bench",
    "no_audit_logs: opt this test out of the default audit-log assertions",
    "zip64: multi-GiB ZIP64 boundary cell; only collected when --sizes reaches 2**31",
    "zip_conformance: fast structural/adversarial ZIP-layout conformance cell; collected by default",
]
