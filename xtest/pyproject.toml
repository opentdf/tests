[project]
name = "xtest"
version = "0.1.0"
description = "OpenTDF cross-SDK integration test suite"
readme = "README.md"
requires-python = ">=3.14"
# SPDX expression, and it is the "Clear" variant: the repo LICENSE withholds
# patent rights, which plain BSD-3-Clause does not. The metadata said
# BSD-3-Clause until DSPX-4793 -- harmless while nothing was published, wrong
# the moment a wheel exists.
license = "BSD-3-Clause-Clear"
authors = [{ name = "OpenTDF Team" }]
keywords = ["opentdf", "tdf", "testing", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "annotated-types>=0.7.0",
    "attrs>=26.1.0",
    "certifi>=2026.5.20",
    "cffi>=2.0.0",
    "charset-normalizer>=3.4.7",
    "construct>=2.10.70",
    "construct-typing>=0.7.0",
    "cryptography>=49.0.0",
    "gitdb>=4.0.12",
    "GitPython>=3.1.50",
    "idna>=3.18",
    "iniconfig>=2.3.0",
    "Jinja2>=3.1.6",
    "jsonschema>=4.25.1",
    "jsonschema-specifications>=2025.9.1",
    "MarkupSafe>=3.0.3",
    "packaging>=26.2",
    "pluggy>=1.6.0",
    "pycparser>=3.0",
    "pydantic>=2.13.4",
    "pydantic_core>=2.41.5",
    "Pygments>=2.19.2",
    "pytest>=9.0.3",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.6.1",
    "pytest-metadata>=3.1.1",
    "referencing>=0.37.0",
    "requests>=2.34.2",
    "rpds-py>=2026.5.1",
    "smmap>=5.0.3",
    "typing_extensions>=4.15.0",
    "urllib3>=2.7.0",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.16",
]

# Loaded before the command line is parsed, which is what pytest_addoption
# needs and what an installed conftest.py cannot offer. Disable with
# `-p no:xtest`.
[project.entry-points.pytest11]
xtest = "xtest.plugin"

[build-system]
requires = ["uv_build>=0.11.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "PERF",   # Perflint
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "B011",   # assert False in test code is common pattern
]

[tool.ruff.lint.isort]
known-first-party = ["xtest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src"]
extraPaths = ["src"]
exclude = ["**/__pycache__", ".venv", ".ruff_cache", ".pytest_cache", "sdk", "tmp"]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["src/xtest/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -v"
# Markers are registered by xtest.plugin.pytest_configure, not here: this table
# is only read when the rootdir is this directory, which stops being true the
# moment a consumer installs the wheel and runs from their own repo.
