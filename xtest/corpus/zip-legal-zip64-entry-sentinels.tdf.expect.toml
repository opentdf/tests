# Derived from the generator's web-basic base, which the Web SDK main (0b5a0dea, after 0.23.0)
# wrote.
# KAO: corpus-r2048 (rsa:2048) on km1, http://localhost:8585.
# Plaintext: 165 bytes.
# Everything before the central directory matches the base byte for byte; the directory and end
# records alone were written afresh.
# Legal trailer: each directory record now stores its sizes and local header offset in a ZIP64
# extra, preceded by an extended-timestamp extra, and the archive gains a ZIP64 end record.
expect = "valid"
format = "tdf"
strict = true
verify_crypto = true
key = "keys/tamper-web-basic.dek"
note = "Spec-legal ZIP trailer: every record's sizes and offset deferred to ZIP64 extras (after a foreign extra), plus a ZIP64 EOCD."

[sdk]
plaintext_sha256 = "ba7f7d4c568520d6197e5c79ddae60a9ee096b4dc222cfd5e1910b754dca3651"
go = "decrypt"
java = "decrypt"
js = "decrypt"
