# Derived from the generator's web-basic base, which the Web SDK main (0b5a0dea, after 0.23.0)
# wrote.
# KAO: corpus-r2048 (rsa:2048) on km1, http://localhost:8585.
# Plaintext: 165 bytes.
# Everything before the central directory matches the base byte for byte; the directory and end
# records alone were written afresh.
# Contradictory trailer: a ZIP64 end record places the central directory at the file's size plus
# 4096 bytes.
expect = "invalid"
format = "tdf"
must_contain = [
    "TDF.CONTAINER.LAYOUT_UNCHECKED",
    "TDF.CONTAINER.PAYLOAD_CORRUPT",
    "TDF.STRUCTURE.MANIFEST_UNREADABLE",
]
note = "Adversarial ZIP trailer: A ZIP64 EOCD declaring a central directory offset 4 KiB past the end of the file; L0 error."

[sdk]
plaintext_sha256 = "ba7f7d4c568520d6197e5c79ddae60a9ee096b4dc222cfd5e1910b754dca3651"
go = "reject"
java = "reject"
js = "reject"
