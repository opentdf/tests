# Derived from the generator's web-basic base, which the Web SDK main (0b5a0dea, after 0.23.0)
# wrote.
# KAO: corpus-r2048 (rsa:2048) on km1, http://localhost:8585.
# Plaintext: 165 bytes.
# Everything before the central directory matches the base byte for byte; the directory and end
# records alone were written afresh.
# Legal trailer: what looks like a second manifest directory entry, pointing 2^63 bytes in through
# ZIP64, sits inside the end record's comment.
expect = "invalid"
format = "tdf"
verify_crypto = true
key = "keys/tamper-web-basic.dek"
must_contain = [
    "TDF.CONTAINER.ARCHIVE_COMMENT",
]
note = "Spec-legal ZIP trailer with an archive comment: an archive comment holding a copy of the manifest's central directory record with a 2^63 offset."

[sdk]
plaintext_sha256 = "ba7f7d4c568520d6197e5c79ddae60a9ee096b4dc222cfd5e1910b754dca3651"
go = "reject"
java = "decrypt"
js = "decrypt"
