# Derived from the generator's web-basic base, which the Web SDK main (0b5a0dea, after 0.23.0)
# wrote.
# KAO: corpus-r2048 (rsa:2048) on km1, http://localhost:8585.
# Plaintext: 165 bytes.
# Everything before the central directory matches the base byte for byte; the directory and end
# records alone were written afresh.
# Legal trailer: alongside a new ZIP64 end record and locator, the classic end record's entry
# count becomes 0xFFFF while its other fields stay real.
expect = "valid"
format = "tdf"
strict = true
verify_crypto = true
key = "keys/tamper-web-basic.dek"
note = "Spec-legal ZIP trailer: a ZIP64 EOCD and locator, with only the EOCD entry count set to its 0xFFFF sentinel."

[sdk]
plaintext_sha256 = "ba7f7d4c568520d6197e5c79ddae60a9ee096b4dc222cfd5e1910b754dca3651"
go = "decrypt"
java = "decrypt"
js = "decrypt"
