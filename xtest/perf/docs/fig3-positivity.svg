<text x="586.00" y="111.18" class="muted" font-size="11.00" text-anchor="end">0.8</text>
<line x1="596.00" y1="286.00" x2="950.00" y2="286.00" class="axis"/>
<line x1="596.00" y1="274.82" x2="950.00" y2="274.82" class="ref"/>
<text x="600.00" y="266.82" class="muted" font-size="11.00" text-anchor="start">alpha = 0.05</text>
<polyline points="640.25,275.49 728.75,262.08 817.25,205.08 905.75,103.82" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="640.25" cy="275.49" r="4.50" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="728.75" cy="262.08" r="4.50" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
