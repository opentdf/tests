<text x="64.00" y="226.67" class="muted" font-size="11.00" text-anchor="end">0.15</text>
<line x1="74.00" y1="159.33" x2="440.00" y2="159.33" class="grid"/>
<text x="64.00" y="163.33" class="muted" font-size="11.00" text-anchor="end">0.30</text>
