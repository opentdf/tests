<text x="394.25" y="98.04" class="ink" font-size="11.00" text-anchor="middle">0.412</text>
<text x="394.25" y="248.47" class="ink" font-size="11.00" text-anchor="middle">0.141 - flat</text>
<text x="119.75" y="306.00" class="muted" font-size="11.00" text-anchor="middle">1.0</text>
