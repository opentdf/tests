<svg xmlns="http://www.w3.org/2000/svg" width="1000.00" height="488.00" viewBox="0 0 1000.00 488.00" role="img" aria-labelledby="t d">
<title id="t">A positive, right-tailed measurement</title>
<desc id="d">Two panels. On the left, the spread of the raw paired difference grows with the effect while the log-ratio's stays flat at 0.141. On the right, stalling the candidate arm only drives the slower tail's rejection rate from 0.047 to 0.815 and the faster tail's to zero, while the median ratio moves only from 1.000 to 1.068. A text row shows the same stall rates applied to both arms, where the true ratio stays 1 and the slower tail holds between 0.039 and 0.057 -- so the curves measure sensitivity to asymmetric contamination, not test size.</desc>
<style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--muted:#52514e;--grid:#dedcd4;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#ffffff;--muted:#c3c2b7;--grid:#3b3a37;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;}.ink{fill:var(--ink);}.muted{fill:var(--muted);}.grid{stroke:var(--grid);stroke-width:1;}.axis{stroke:var(--muted);stroke-width:1;}.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;}.rule{stroke:var(--muted);stroke-width:1;}</style>
