<text x="586.00" y="200.59" class="muted" font-size="11.00" text-anchor="end">0.4</text>
<line x1="596.00" y1="151.88" x2="950.00" y2="151.88" class="grid"/>
<text x="586.00" y="155.88" class="muted" font-size="11.00" text-anchor="end">0.6</text>
