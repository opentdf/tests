<text x="64.00" y="30.00" class="ink" font-size="15.00" text-anchor="start" font-weight="600">A positive, right-tailed measurement</text>
<text x="64.00" y="52.00" class="muted" font-size="12.00" text-anchor="start">Taking logs makes the spread independent of the effect. It does not make the two tails behave alike.</text>
<text x="74.00" y="80.00" class="ink" font-size="12.00" text-anchor="start" font-weight="600">Scale: the log absorbs it</text>
