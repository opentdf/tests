<circle cx="817.25" cy="285.78" r="4.50" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="905.75" cy="286.00" r="4.50" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<text x="905.75" y="89.82" class="ink" font-size="11.00" text-anchor="middle">0.815</text>
<text x="905.75" y="272.00" class="ink" font-size="11.00" text-anchor="middle">0.000</text>
<text x="640.25" y="306.00" class="muted" font-size="11.00" text-anchor="middle">0%</text>
<text x="728.75" y="306.00" class="muted" font-size="11.00" text-anchor="middle">5%</text>
<text x="817.25" y="306.00" class="muted" font-size="11.00" text-anchor="middle">15%</text>
<text x="905.75" y="306.00" class="muted" font-size="11.00" text-anchor="middle">30%</text>
<text x="584.00" y="328.00" class="muted" font-size="11.00" text-anchor="end">median ratio</text>
<text x="640.25" y="328.00" class="muted" font-size="11.00" text-anchor="middle">1.000</text>
<text x="728.75" y="328.00" class="muted" font-size="11.00" text-anchor="middle">1.008</text>
<text x="817.25" y="328.00" class="muted" font-size="11.00" text-anchor="middle">1.026</text>
<text x="905.75" y="328.00" class="muted" font-size="11.00" text-anchor="middle">1.068</text>
<text x="584.00" y="346.00" class="muted" font-size="11.00" text-anchor="end">both arms stalled</text>
<text x="640.25" y="346.00" class="muted" font-size="11.00" text-anchor="middle">0.048</text>
<text x="728.75" y="346.00" class="muted" font-size="11.00" text-anchor="middle">0.051</text>
<text x="817.25" y="346.00" class="muted" font-size="11.00" text-anchor="middle">0.057</text>
<text x="905.75" y="346.00" class="muted" font-size="11.00" text-anchor="middle">0.039</text>
<text x="773.00" y="368.00" class="muted" font-size="11.00" text-anchor="middle">share of rounds stalled, on the candidate arm only</text>
<rect x="596.00" y="390.00" width="10.00" height="10.00" rx="2.00" fill="var(--s1)"/>
<text x="612.00" y="398.00" class="muted" font-size="11.00" text-anchor="start">slower tail</text>
<rect x="692.40" y="390.00" width="10.00" height="10.00" rx="2.00" fill="var(--s2)"/>
<text x="708.40" y="398.00" class="muted" font-size="11.00" text-anchor="start">faster tail</text>
<text x="64.00" y="432.00" class="muted" font-size="11.00" text-anchor="start">Signed-rank needs the paired difference symmetric under H0. Stalling one arm breaks that directionally -- and moves the true median, so the</text>
<text x="64.00" y="450.00" class="muted" font-size="11.00" text-anchor="start">plotted rates are power against a 2.6% effect, not size. Stall both arms and the true ratio stays 1: the slower tail holds at nominal.</text>
<text x="64.00" y="468.00" class="muted" font-size="11.00" text-anchor="start">Either way it is the interval, not the p-value, that refuses to call 1.026 a regression.</text>
</svg>
