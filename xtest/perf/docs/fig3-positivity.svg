<text x="394.25" y="306.00" class="muted" font-size="11.00" text-anchor="middle">4.0</text>
<text x="257.00" y="368.00" class="muted" font-size="11.00" text-anchor="middle">true ratio (candidate / baseline)</text>
<rect x="74.00" y="390.00" width="10.00" height="10.00" rx="2.00" fill="var(--s1)"/>
<text x="90.00" y="398.00" class="muted" font-size="11.00" text-anchor="start">sd of raw difference</text>
<rect x="228.00" y="390.00" width="10.00" height="10.00" rx="2.00" fill="var(--s2)"/>
<text x="244.00" y="398.00" class="muted" font-size="11.00" text-anchor="start">sd of log-ratio</text>
<text x="596.00" y="80.00" class="ink" font-size="12.00" text-anchor="start" font-weight="600">Skew: it does not</text>
